name: Deploy Backend to Tencent Server

on:
  push:
    branches: [master]
    paths:
      - '**' # 监听所有代码变更（可根据需要调整为特定路径）
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -o myworld-backend .
          test -f myworld-backend && echo "✅ Build OK: myworld-backend"

      - name: Upload binary via SCP (直接上传到最终目录)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "myworld-backend"
          target: "/www/wwwroot/api.mhy.ink/"
          strip_components: 0   # 保持文件路径
          overwrite: true       # 直接覆盖旧文件

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -ex
            DEPLOY_DIR="/www/wwwroot/api.mhy.ink"
            mkdir -p "$DEPLOY_DIR" 
            cd "$DEPLOY_DIR"
            
            # 确保文件存在且可执行
            if [ ! -f myworld-backend ]; then
              echo "❌ Error: myworld-backend not found in $DEPLOY_DIR"
              exit 1
            fi
            chmod +x myworld-backend
            
            # 备份旧版本（如果存在）
            if [ -f myworld-backend.bak ]; then
              rm -f myworld-backend.bak.old || true
              mv myworld-backend.bak myworld-backend.bak.old || true
            fi
            if [ -f myworld-backend ]; then
              cp myworld-backend myworld-backend.bak || true
            fi
            
            # 停止旧进程（如果正在运行）
            pkill -f myworld-backend || true
            sleep 2
            
            # 启动新进程（带日志输出）
            nohup ./myworld-backend > server.log 2>&1 &
            sleep 2
            
            # 检查是否成功启动
            if pgrep -f myworld-backend > /dev/null; then
              echo "✅ Backend started successfully (PID: $(pgrep -f myworld-backend))"
            else
              echo "❌ Failed to start backend, check logs in $DEPLOY_DIR/server.log"
              exit 1
            fi
            echo "✅ Deploy finished."