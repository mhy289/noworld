name: Deploy Backend to Tencent Server

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy Backend (Go)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o myworld-backend .
          test -f myworld-backend && echo "Build OK: myworld-backend"

      # 将二进制上传到服务器临时目录
      - name: Upload binary via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "backend/myworld-backend"
          target: ${{ secrets.DEPLOY_TMP_DIR || '/tmp/myworld-deploy' }}

      # 在服务器上替换旧版本并重启服务
      - name: Deploy & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
            mkdir -p "$DEPLOY_DIR"
            # 备份旧版本（若存在）
            if [ -f "$DEPLOY_DIR/myworld-backend" ]; then
              cp "$DEPLOY_DIR/myworld-backend" "$DEPLOY_DIR/myworld-backend.bak" || true
            fi
            # 替换为新二进制
            install -m 0755 /tmp/myworld-deploy/backend/myworld-backend "$DEPLOY_DIR/myworld-backend"
            # 重启服务（systemd 或 nohup 二选一，按服务器实际配置调整）
            if systemctl list-unit-files | grep -q '^myworld-backend.service'; then
              sudo systemctl restart myworld-backend
              sudo systemctl --no-pager status myworld-backend --lines=0
            else
              pkill -f myworld-backend || true
              cd "$DEPLOY_DIR" && nohup ./myworld-backend > server.log 2>&1 &
              sleep 2
            fi
            echo "Deploy finished."
