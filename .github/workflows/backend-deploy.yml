name: Deploy Backend to Tencent Server

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -o myworld-backend .
          test -f myworld-backend && echo "✅ Build OK: myworld-backend"

      - name: Upload binary via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "myworld-backend"
          target: "/www/wwwroot/api.mhy.ink/"
          strip_components: 0
          overwrite: true

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            DEPLOY_DIR="/www/wwwroot/api.mhy.ink"
            
            if [ ! -f "$DEPLOY_DIR/myworld-backend" ]; then
              echo "❌ Error: myworld-backend not found in $DEPLOY_DIR"
              exit 1
            fi
            
            chmod +x "$DEPLOY_DIR/myworld-backend"
            
            # 重新加载 systemd 配置（确保服务文件是最新的）
            sudo systemctl daemon-reload
            
            sudo systemctl restart myworld-backend
            sleep 2
            
            if sudo systemctl is-active --quiet myworld-backend; then
              echo "✅ Backend started successfully"
              sudo systemctl status myworld-backend --no-pager --lines=0
            else
              echo "❌ Failed to start backend"
              sudo systemctl status myworld-backend --no-pager --lines=10
              exit 1
            fi
            
            echo "✅ Deploy finished."